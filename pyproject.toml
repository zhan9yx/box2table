[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "table2docs"
version = "0.1.0"
description = "解决终端方框表直接贴进 Google Docs 变乱码、断行错乱。macOS。"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yixuan.zhang" }]
keywords = ["clipboard", "google-docs", "macos", "markdown"]

[project.urls]
Homepage = "https://github.com/zhan9yx/table2docs"

[project.scripts]
table2docs = "table2docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
